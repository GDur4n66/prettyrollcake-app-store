<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>btcd</title>
<link rel="icon" href="icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="brand"><img src="icon.svg" alt=""><span>btcd</span><small id="version"></small></div>
  <div id="state" class="state">接続中…</div>
</header>

<main>
  <div id="notice" class="notice" hidden></div>

  <section class="card sync">
    <div class="label">同期</div>
    <div class="height"><strong id="blocks">—</strong><span>ブロック</span></div>
    <div class="bar"><i id="bar"></i></div>
    <div class="meta" id="syncMeta">—</div>
  </section>

  <section class="grid">
    <div class="card stat"><div class="label">ネットワーク</div><b id="chain">—</b></div>
    <div class="card stat"><div class="label">ピア</div><b id="peers">—</b><small id="peersSub"></small></div>
    <div class="card stat"><div class="label">データ容量</div><b id="size">—</b></div>
    <div class="card stat"><div class="label">稼働時間</div><b id="uptime">—</b></div>
  </section>

  <section class="card">
    <div class="label">接続情報</div>
    <p class="hint">btcctl や btcd 対応のウォレットから RPC で接続できます。RPC は TLS で、下の証明書が必要です。</p>
    <dl class="kv">
      <dt>RPC</dt><dd><code id="rpcAddr">—</code></dd>
      <dt>ユーザー</dt><dd><code id="rpcUser">—</code></dd>
      <dt>パスワード</dt><dd><code id="rpcPass" class="secret">••••••••</code> <button id="showPass" class="link">表示</button> <button id="copyPass" class="link">コピー</button></dd>
      <dt>証明書</dt><dd><a href="api/rpc.cert" class="link">rpc.cert をダウンロード</a></dd>
      <dt>P2P</dt><dd><code id="p2pAddr">—</code></dd>
      <dt>Tor (P2P)</dt><dd><code id="onion">—</code></dd>
      <dt>Umbrel 内</dt><dd><code id="internal">—</code></dd>
    </dl>
    <details class="example">
      <summary>btcctl の例</summary>
      <pre id="btcctl"></pre>
    </details>
  </section>

  <section class="card">
    <div class="label">設定</div>
    <form id="settings">
      <label>ネットワーク
        <select name="network" id="network"></select>
      </label>
      <label>UTXO キャッシュ (MiB)
        <input name="utxoCacheMiB" id="utxoCacheMiB" type="number" step="1">
      </label>
      <label class="check"><input type="checkbox" name="torOnly" id="torOnly"> すべての通信を Tor 経由にする<small>オフでも .onion のピアには Tor でつなぎます</small></label>
      <label class="check"><input type="checkbox" name="txindex" id="txindex"> トランザクションインデックス（txindex）<small>getrawtransaction で任意の取引を引けます</small></label>
      <label class="check"><input type="checkbox" name="addrindex" id="addrindex"> アドレスインデックス（addrindex）<small>searchrawtransactions 用。txindex が必要で、容量と同期時間が増えます</small></label>
      <div class="actions">
        <span id="formMsg" class="msg"></span>
        <button type="submit">保存して再起動</button>
      </div>
    </form>
  </section>
</main>
<script src="app.js"></script>
</body>
</html>
