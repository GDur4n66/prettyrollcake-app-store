<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macaroon 管理</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <h1>Macaroon 管理</h1>
    <span id="node" class="muted"></span>
    <button id="logout" class="link" hidden>ログアウト</button>
  </header>

  <main>
    <section id="login" hidden>
      <form id="login-form" class="card narrow">
        <label>パスワード<input type="password" name="password" autocomplete="current-password" required autofocus></label>
        <button type="submit">ログイン</button>
        <p class="error" id="login-error"></p>
      </form>
    </section>

    <section id="app" hidden>
      <nav class="tabs">
        <button data-tab="list" class="active">ID 一覧</button>
        <button data-tab="create">作る</button>
        <button data-tab="inspect">確かめる</button>
        <button data-tab="files">LND のファイル</button>
      </nav>
      <p class="error" id="global-error"></p>

      <div id="tab-list" class="tab"></div>

      <div id="tab-create" class="tab" hidden>
        <form id="create-form" class="card">
          <fieldset>
            <legend>ルートキー ID</legend>
            <label class="inline"><input type="radio" name="idmode" value="new" checked> 新しい ID で作る</label>
            <label class="inline"><input type="radio" name="idmode" value="existing"> 既存の ID で作る</label>
            <select name="rootKeyId" disabled></select>
            <p class="hint" id="id-hint">新しい ID で作ると、あとでその ID を削除するだけで、この macaroon をまとめて無効にできます。</p>
          </fieldset>

          <div class="row">
            <label>名前<input name="keyName" maxlength="100" placeholder="例: スマホのウォレット"></label>
            <label>この macaroon のメモ（任意）<input name="note" maxlength="200" placeholder="例: 受け取り専用で発行"></label>
          </div>
          <label>ID のメモ（任意）<textarea name="memo" rows="2" maxlength="2000"></textarea></label>

          <fieldset>
            <legend>権限</legend>
            <div class="notice warn" id="create-notice" hidden></div>
            <div class="presets" id="presets"></div>
            <table class="perm-grid" id="perm-grid"></table>
            <details id="uri-box">
              <summary>RPC を1つずつ許可する（<span id="uri-count">0</span> 件選択中）</summary>
              <input type="search" id="uri-search" placeholder="RPC 名で絞り込み（例: AddInvoice）">
              <div id="uri-list" class="uri-list"></div>
            </details>
            <p id="perm-summary" class="summary"></p>
          </fieldset>

          <fieldset>
            <legend>制限（任意）</legend>
            <div class="row">
              <label>有効期限
                <select name="expiry">
                  <option value="">なし</option>
                  <option value="1">1 日</option>
                  <option value="7">7 日</option>
                  <option value="30">30 日</option>
                  <option value="90">90 日</option>
                  <option value="365">1 年</option>
                  <option value="custom">日時を指定</option>
                </select>
              </label>
              <label id="expiry-custom-label" hidden>期限の日時<input type="datetime-local" name="expiryCustom"></label>
            </div>
            <div class="row">
              <label>IP アドレスを固定<input name="ipAddress" placeholder="例: 192.0.2.10"></label>
              <label>IP の範囲を固定<input name="ipRange" placeholder="例: 192.0.2.0/24"></label>
            </div>
            <p class="hint">IP は LND から見た接続元です。リバースプロキシや Tor 経由だと、その中継の IP になります。</p>
          </fieldset>

          <button type="submit" class="primary">macaroon を作る</button>
          <p class="error" id="create-error"></p>
        </form>

        <div id="create-result" class="card result" hidden></div>
      </div>

      <div id="tab-files" class="tab" hidden></div>

      <div id="tab-inspect" class="tab" hidden>
        <form id="inspect-form" class="card">
          <label>macaroon（hex または base64）<textarea name="macaroon" rows="4" spellcheck="false" autocomplete="off"></textarea></label>
          <label>またはファイルを選ぶ（.macaroon）<input type="file" id="inspect-file"></label>
          <button type="submit" class="primary">確かめる</button>
          <p class="hint">入力した macaroon はこのアプリに保存されません。</p>
          <p class="error" id="inspect-error"></p>
        </form>
        <div id="inspect-result" class="card result" hidden></div>
      </div>
    </section>
  </main>
  <script src="/app.js" type="module"></script>
</body>
</html>
