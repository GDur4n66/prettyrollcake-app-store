version: "3.7"

services:
  admin:
    image: dpage/pgadmin4:9.19@sha256:3591b3d02910dcd817dec6fcaa681c278ba6966945283dd0ea0042731c330c83
    restart: on-failure
    volumes:
      - ${APP_DATA_DIR}/data:/var/lib/pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: "umbrel@example.com"
      PGADMIN_DEFAULT_PASSWORD: ${APP_PASSWORD}
    ports:
      - 38800:80
