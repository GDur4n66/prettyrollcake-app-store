version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: prettyrollcake-rune-manager_web_1
      APP_PORT: 3630

  web:
    # Built from images/cln-rune-manager by .github/workflows/cln-rune-manager-image.yml
    image: ghcr.io/gdur4n66/cln-rune-manager:0.2.3@sha256:0043031834255f3bada356c59261874e8ec1be4f6f61fdb6d2b3961622561b5c
    # Runs as root on purpose: lightningd runs as root and creates
    # lightning-rpc with mode 0600, so only uid 0 can connect to it.
    # Every capability is dropped except DAC_OVERRIDE, which lets uid 0 reach
    # the socket even when the owner of the folder was changed from root
    # (for example a bitcoin/ folder chowned to 1000 with mode 0700).
    user: "0:0"
    cap_drop:
      - ALL
    cap_add:
      - DAC_OVERRIDE
    security_opt:
      - no-new-privileges:true
    restart: on-failure
    init: true
    stop_grace_period: 10s
    volumes:
      # Read-only, and only the network folder. The whole folder (not the
      # socket file) is mounted because lightningd recreates the socket on
      # every start.
      - ${APP_CORE_LIGHTNING_DATA_DIR}/${APP_CORE_LIGHTNING_BITCOIN_NETWORK}:/cln:ro
      - ${APP_DATA_DIR}/data:/data
    environment:
      # Talk JSON-RPC to lightningd directly: no rune and no TLS settings
      CLN_RPC_SOCKET: "/cln/lightning-rpc"
      # Only shown in the usage example next to a new rune
      CLN_PUBLIC_REST_URL: "https://${DEVICE_DOMAIN_NAME}:${CORE_LIGHTNING_REST_PORT}"
      ADMIN_PASSWORD: "${APP_PASSWORD}"
