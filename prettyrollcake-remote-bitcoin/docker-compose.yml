version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $APP_REMOTE_BITCOIN_IP
      APP_PORT: 8080

  web:
    image: ghcr.io/gdur4n66/remote-bitcoin:0.3.0@sha256:3d8a98cae13270865945eb763d01440c65921e1ce52f33d356d24ea90f0984c1
    user: "1000:1000"
    restart: always
    init: true
    volumes:
      - ${APP_DATA_DIR}/data:/data
    networks:
      default:
        ipv4_address: $APP_REMOTE_BITCOIN_IP
