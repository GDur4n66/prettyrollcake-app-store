version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: prettyrollcake-lnproxy-relay_relay_1
      APP_PORT: 4747
      # Wallets and apps call the API without an Umbrel login (LAN and Tor).
      # The status page at / still needs the login.
      PROXY_AUTH_WHITELIST: "/spec,/events"

  relay:
    # Built from images/lnproxy-relay by .github/workflows/lnproxy-relay-image.yml
    image: ghcr.io/gdur4n66/lnproxy-relay:0.3.4@sha256:cf4463ca7ed007bd3fb252637c6f1f36a0563148b96bc7f00f3eb042c56c5821
    user: "1000:1000"
    restart: on-failure
    init: true
    # On stop the relay stops accepting requests and waits for payments in flight
    stop_grace_period: 1m
    volumes:
      # Read-only: tls.cert and admin.macaroon
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
      - ${APP_DATA_DIR}/data:/data
    environment:
      LNPROXY_LND_HOST: "https://${APP_LIGHTNING_NODE_IP}:${APP_LIGHTNING_NODE_REST_PORT}"
      LNPROXY_LND_CERT: "/lnd/tls.cert"
      # tls.cert itself is the only trusted certificate, so skipping the
      # hostname check cannot connect to anything else
      LNPROXY_LND_TLS_VERIFY_HOSTNAME: "false"
      LNPROXY_MACAROON: "/lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/admin.macaroon"
      # mainnet, testnet, signet or regtest: follows Umbrel's Bitcoin Node
      LNPROXY_NETWORK: "${APP_BITCOIN_NETWORK}"
      LNPROXY_PUBLIC_URL: "http://${APP_HIDDEN_SERVICE}"
      # The app password (64 hex characters) receives events for every invoice
      LNPROXY_ADMIN_TOKEN: "${APP_PASSWORD}"
      LNPROXY_DB: "/data/lnproxy-relay.db"
      # Seconds the original invoice must still be valid; the wrapped invoice
      # expires this much earlier. At least 60. Lower it (for example 60) to
      # wrap invoices with short expiries such as 120 seconds.
      LNPROXY_EXPIRY_BUFFER: "300"
