  <rect x="86" y="142" width="340" height="236" rx="28" fill="url(#wrap)"/>
  <path d="M100 160 L256 278 L412 160" fill="none" stroke="#2a1a5e" stroke-width="18" stroke-linejoin="round" stroke-linecap="round" opacity=".55"/>
  <!-- lightning bolt inside -->
