<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="wrap" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#b9a6ff"/><stop offset="1" stop-color="#6d3fd1"/></linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffcf5a"/><stop offset="1" stop-color="#f29a00"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#171717"/>
