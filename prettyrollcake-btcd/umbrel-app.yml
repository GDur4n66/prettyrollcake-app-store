id: prettyrollcake-btcd
category: bitcoin
name: "BTCD"
version: "v0.25.0"
tagline: An alternative full node bitcoin implementation written in Go (golang)
description: >-
  One key difference between btcd and Bitcoin Core is that btcd does NOT include wallet functionality and this was a very intentional design decision. 
  See the blog entry here for more details. 
  This means you can't actually make or receive payments directly with btcd. 
  That functionality is provided by the btcwallet and Paymetheus (Windows-only) projects which are both under active development.
