manifestVersion: 1
id: prettyrollcake-blocktime
category: bitcoin
name: Blocktime
version: "1.2.0"
tagline: Find the Bitcoin block for any moment in time
icon: https://raw.githubusercontent.com/GDur4n66/prettyrollcake-app-store/master/prettyrollcake-blocktime/icon.svg
description: >-
  Enter a date and time to find the latest Bitcoin block that had been mined
  at that moment. Blocktime searches a mempool explorer of your choice: the
  Mempool app on this Umbrel, a mempool on another host, or mempool.space.
  It shows the exact block height, timestamp and hash.


  Future dates are clearly marked as estimates based on Bitcoin's average
  ten-minute block interval.
releaseNotes: >-
  Blocktime now runs from its own Docker image, so updates install
  correctly. If Blocktime 1.1.x did not start after updating, this release
  fixes it.


  1.1.0: Blocktime no longer requires the Mempool app. Choose which mempool
  to use from the settings (gear icon, top right): the Mempool app on this
  Umbrel, any mempool URL such as one on another host, or mempool.space.
