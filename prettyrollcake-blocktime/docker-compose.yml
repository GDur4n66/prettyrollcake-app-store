version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: prettyrollcake-blocktime_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    # Built from images/blocktime by .github/workflows/blocktime-image.yml
    image: ghcr.io/gdur4n66/blocktime:1.2.0@sha256:f1b7963697170f41e8245a720f07feed4beac4b3d3e8fe0fd011d60f0238bd5a
    restart: on-failure
    init: true
    environment:
      # Umbrel's Mempool app (used when "Umbrel の Mempool" is selected)
      UMBREL_MEMPOOL_URL: "http://10.21.21.26:3006"
      UMBREL_MEMPOOL_PORT: "3006"
    volumes:
      - ${APP_DATA_DIR}/data:/data
