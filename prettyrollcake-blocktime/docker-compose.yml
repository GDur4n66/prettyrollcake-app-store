version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: prettyrollcake-blocktime_web_1
      APP_PORT: 80
      PROXY_AUTH_ADD: "false"

  web:
    image: nginx:1.27-alpine@sha256:65645c7bb6a0661892a8b03b89d0743208a18dd2f3f17a54ef4b76fb8e2f2a10
    restart: on-failure
    environment:
      MEMPOOL_IP: $APP_MEMPOOL_IP
      MEMPOOL_PORT: $APP_MEMPOOL_PORT
    volumes:
      - ${APP_DATA_DIR}/web:/usr/share/nginx/html:ro
      - ${APP_DATA_DIR}/nginx.conf:/etc/nginx/templates/default.conf.template:ro
