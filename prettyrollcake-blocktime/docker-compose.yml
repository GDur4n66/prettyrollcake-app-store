version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: prettyrollcake-blocktime_web_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "false"

  web:
    image: python:3.12-alpine@sha256:e6dae589c1c05976188fd3bd019afd091445fc533ed2ea29001beddc7368a9c8
    user: "1000:1000"
    restart: on-failure
    init: true
    command: ["python", "-I", "/server/server.py"]
    environment:
      PORT: "8080"
      WEB_DIR: /web
      SETTINGS_FILE: /data/settings.json
      # Umbrel's Mempool app (used when "Umbrel の Mempool" is selected)
      UMBREL_MEMPOOL_URL: "http://10.21.21.26:3006"
      UMBREL_MEMPOOL_PORT: "3006"
    volumes:
      - ${APP_DATA_DIR}/web:/web:ro
      - ${APP_DATA_DIR}/server:/server:ro
      - ${APP_DATA_DIR}/data:/data
