server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /mempool-api/ {
        proxy_pass http://${MEMPOOL_IP}:${MEMPOOL_PORT}/api/;
        proxy_set_header Host ${MEMPOOL_IP}:${MEMPOOL_PORT};
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
