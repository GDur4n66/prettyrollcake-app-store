<!doctype html>
<html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f7931a"><title>Blocktime — 接続先</title><link rel="stylesheet" href="styles.css">
<style>
.settings{display:grid;gap:18px}
.choice{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:400}
.choice:has(input:checked){border-color:var(--orange);box-shadow:inset 3px 0 0 var(--orange)}
.choice input{width:auto;height:auto;margin:3px 0 0;accent-color:var(--orange)}
.choice b{display:block;font-size:14px}
.choice small{display:block;color:var(--muted);font:11px monospace;margin-top:4px;line-height:1.6}
.choice input[type=url]{width:100%;margin-top:10px;height:44px;padding:0 14px}
.err{color:#c4372c;font:11px monospace;margin-top:6px}
.actions{display:flex;gap:12px;flex-wrap:wrap}
.actions button{height:48px;border:1px solid var(--ink);background:none;color:var(--ink);padding:0 22px;font-weight:700;cursor:pointer}
.actions button.primary{background:var(--ink);color:#fff}
.actions button.primary:hover{background:var(--orange);border-color:var(--orange)}
.actions button:disabled{opacity:.5;cursor:default}
#msg{min-height:20px;font:12px monospace;color:var(--muted)}
#msg.ok{color:#33804d} #msg.bad{color:#c4372c}
header a{color:inherit;text-decoration:none}
.back{font:11px monospace;color:var(--ink)}
</style></head>
<body><header><a class="brand" href="./"><b>₿</b><span>BLOCKTIME</span></a><a class="back" href="./">← 検索に戻る</a></header>
<main><section class="hero"><p class="label">⚙ &nbsp; SETTINGS</p><h1>どの <em>mempool</em> で<br>探すか。</h1><p>ブロックの検索に使う mempool を選びます。</p></section>
<section class="card"><form id="form" class="settings" novalidate>
<label class="choice"><input type="radio" name="source" value="umbrel"><span><b>Umbrel の Mempool</b><small>この Umbrel にインストールした Mempool アプリを使います。</small></span></label>
<label class="choice"><input type="radio" name="source" value="mempool.space"><span><b>mempool.space</b><small>公開の mempool.space を使います。Mempool アプリが無くても使えますが、調べた日時のブロックへの問い合わせが mempool.space に届きます。</small></span></label>
<label class="choice"><input type="radio" name="source" value="custom"><span style="flex:1"><b>任意の URL</b><small>別ホストの mempool など。例: http://192.168.1.20:3006</small><input id="customUrl" name="customUrl" type="url" placeholder="http://192.168.1.20:3006" autocomplete="off"><span class="err" data-for="customUrl"></span></span></label>
<div class="actions"><button type="button" id="testBtn">接続テスト</button><button type="submit" class="primary" id="saveBtn">保存</button></div>
<p id="msg" role="status"></p>
</form></section></main>
<footer>BLOCKTIME / SELF-HOSTED <span id="footer-source"></span></footer>
<script>
const form = document.getElementById('form'), msg = document.getElementById('msg');
const setMsg = (t, c) => { msg.textContent = t; msg.className = c || ''; };
const values = () => ({source: (form.querySelector('input[name=source]:checked') || {}).value, customUrl: form.customUrl.value});
const showErrors = (e) => form.querySelectorAll('.err').forEach((b) => { b.textContent = (e || {})[b.dataset.for] || ''; });
async function post(path, body) {
  const r = await fetch(path, {method: 'POST', headers: {'Content-Type': 'application/json', 'X-Requested-With': 'blocktime'}, body: JSON.stringify(body)});
  let d = {}; try { d = await r.json(); } catch (e) {}
  return {ok: r.ok, data: d};
}
function setFooter(label) { document.getElementById('footer-source').textContent = 'DATA FROM ' + label; }
form.customUrl.addEventListener('focus', () => { form.querySelector('input[value=custom]').checked = true; });
document.getElementById('testBtn').onclick = async (ev) => {
  ev.currentTarget.disabled = true; setMsg('テスト中…');
  try {
    const {ok, data} = await post('config/test', values());
    showErrors(data.errors);
    if (!ok) setMsg(data.error || '入力を確認してください。', 'bad');
    else if (data.ok) setMsg(`✓ 接続できました（最新ブロック #${data.height.toLocaleString()}）`, 'ok');
    else setMsg(`✗ ${data.error}（${data.url}）`, 'bad');
  } catch (e) { setMsg('テストできませんでした: ' + e, 'bad'); }
  finally { ev.currentTarget.disabled = false; }
};
form.onsubmit = async (ev) => {
  ev.preventDefault(); const btn = document.getElementById('saveBtn'); btn.disabled = true;
  try {
    const {ok, data} = await post('config', values());
    showErrors(data.errors);
    if (!ok) { setMsg(data.error || '入力を確認してください。', 'bad'); return; }
    if (data.customUrl) form.customUrl.value = data.customUrl;
    setFooter(data.label); setMsg('保存しました。', 'ok');
  } catch (e) { setMsg('保存できませんでした: ' + e, 'bad'); }
  finally { btn.disabled = false; }
};
fetch('config').then((r) => r.json()).then((c) => {
  form.querySelector(`input[value="${c.source}"]`).checked = true;
  form.customUrl.value = c.customUrl || '';
  setFooter(c.label);
}).catch((e) => setMsg('設定を読み込めませんでした: ' + e, 'bad'));
</script></body></html>
