version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: prettyrollcake-frigate_server_1
      APP_PORT: 50012

  server:
    # Built from images/frigate by .github/workflows/frigate-image.yml
    image: ghcr.io/gdur4n66/frigate:1.6.1@sha256:1d6fa949f529758b7c58824df47a7c9f0f9812d77e406b1cec36137088fbc010
    # frigateapp.py writes config.toml on the first start, runs Frigate and
    # serves the status page on :50012 (it needs Frigate's loopback-only
    # admin port, so both run in this container).
    user: "1000:1000"
    group_add:
      - "${APP_FRIGATE_RENDER_GID}"
    restart: on-failure
    stop_grace_period: 2m
    init: true
    devices:
      - /dev/dri:/dev/dri
    ports:
      - "50011:50011" # Electrum (TCP)
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      HOME: /data
      APP_BITCOIN_NETWORK: "${APP_BITCOIN_NETWORK:-mainnet}"
      APP_BITCOIN_NODE_IP: ${APP_BITCOIN_NODE_IP}
      APP_BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      APP_BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      APP_BITCOIN_RPC_PASS: ${APP_BITCOIN_RPC_PASS}
      APP_BITCOIN_ZMQ_SEQUENCE_PORT: ${APP_BITCOIN_ZMQ_SEQUENCE_PORT}
      APP_ELECTRS_NODE_IP: ${APP_ELECTRS_NODE_IP}
      APP_ELECTRS_NODE_PORT: ${APP_ELECTRS_NODE_PORT}
      DEVICE_DOMAIN_NAME: ${DEVICE_DOMAIN_NAME}
