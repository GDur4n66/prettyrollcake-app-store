manifestVersion: 1
id: prettyrollcake-frigate
category: bitcoin
name: Frigate
version: "1.5.3-opencl.2"
tagline: Silent Payments Electrum server
description: >-
  Frigate is an Electrum server for Silent Payments (BIP352). It scans for
  Silent Payments server-side using ephemeral in-memory client keys and
  forwards other Electrum requests to the Electrs app. Historical scanning can
  use a supported GPU when one is exposed to the container, and otherwise
  falls back to the CPU. Frigate has no graphical interface; connect an
  Electrum client to port 50011 on your Umbrel.
releaseNotes: >-
  Reduces the default memory footprint for small deployments while retaining
  Intel OpenCL GPU-assisted historical scanning on Umbrel Home 2 and 3.
developer: Sparrow Wallet
website: https://github.com/sparrowwallet/frigate
dependencies:
  - bitcoin
  - electrs
repo: https://github.com/sparrowwallet/frigate
support: https://github.com/sparrowwallet/frigate/issues
port: 50011
gallery: []
path: ""
