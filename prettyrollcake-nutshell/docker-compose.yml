version: "3.7"

services:
  app_proxy:
    environment:
      # Umbrel の「開く」は Orchard（ミントの管理画面）
      APP_HOST: prettyrollcake-nutshell_orchard_1
      APP_PORT: 3321

  mint:
    image: cashubtc/nutshell:0.22.1@sha256:05b536e0e3d6beee75417ece319a3f89a687d34cfb3cc12c6b19d253104b450e
    restart: on-failure
    stop_grace_period: 1m
    command: ["poetry", "run", "mint"]
    depends_on:
      - redis
    ports:
      - 3338:3338
    volumes:
      # MINT_PRIVATE_KEY や Lightning の設定はここ（hooks/pre-start が無ければ作る）
      - ${APP_DATA_DIR}/.env:/app/.env
      - ${APP_DATA_DIR}/data/mint:/app/data/mint
      - ${APP_DATA_DIR}/data/wallet-data:/root/.cashu
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
    environment:
      MINT_LISTEN_HOST: 0.0.0.0
      MINT_LISTEN_PORT: 3338
      MINT_REDIS_CACHE_ENABLED: "TRUE"
      MINT_REDIS_CACHE_URL: redis://prettyrollcake-nutshell_redis_1:6379
      # Orchard が使う管理用 RPC（Umbrel 内のネットワークだけで使う）
      MINT_RPC_SERVER_ENABLE: "TRUE"
      MINT_RPC_SERVER_ADDR: 0.0.0.0
      MINT_RPC_SERVER_PORT: 8086
      MINT_RPC_SERVER_MUTUAL_TLS: "FALSE"

  redis:
    image: redis:7.4-alpine@sha256:8da19c7399dca900c6822a1cf30f9d2285585e2c4b457ff4095b0f4500054d3f
    restart: always

  orchard:
    image: ghcr.io/cashubtc/orchard:1.12.1@sha256:12b0f0ea9f87fa754829a9531392798fd6b48dbd913cbdd66338d87d0d7b1104
    restart: on-failure
    depends_on:
      - mint
    environment:
      NODE_ENV: production
      # 初回セットアップ用のキー。Umbrel のアプリ画面に「パスワード」として表示される
      SETUP_KEY: ${APP_PASSWORD}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 3321
      LOG_LEVEL: warn
      MINT_TYPE: nutshell
      MINT_API: http://prettyrollcake-nutshell_mint_1:3338
      MINT_DATABASE: /nutshell/mint/mint.sqlite3
      MINT_RPC_HOST: prettyrollcake-nutshell_mint_1
      MINT_RPC_PORT: 8086
      MINT_RPC_MTLS: "false"
      BITCOIN_TYPE: core
      BITCOIN_RPC_HOST: ${APP_BITCOIN_NODE_IP}
      BITCOIN_RPC_PORT: ${APP_BITCOIN_RPC_PORT}
      BITCOIN_RPC_USER: ${APP_BITCOIN_RPC_USER}
      BITCOIN_RPC_PASSWORD: ${APP_BITCOIN_RPC_PASS}
      LIGHTNING_TYPE: lnd
      LIGHTNING_RPC_HOST: ${APP_LIGHTNING_NODE_IP}
      LIGHTNING_RPC_PORT: ${APP_LIGHTNING_NODE_GRPC_PORT}
      LIGHTNING_MACAROON: /lnd/data/chain/bitcoin/${APP_BITCOIN_NETWORK}/readonly.macaroon
      LIGHTNING_CERT: /lnd/tls.cert
    volumes:
      - ${APP_DATA_DIR}/orchard-data:/app/data
      - ${APP_DATA_DIR}/data:/nutshell
      - ${APP_LIGHTNING_NODE_DATA_DIR}:/lnd:ro
