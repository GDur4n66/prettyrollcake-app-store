version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: prettyrollcake-scrutiny_scrutiny_1
      APP_PORT: 8080

  scrutiny:
    # Upstream omnibus image (web UI + collector + InfluxDB), pinned by digest
    image: ghcr.io/analogj/scrutiny:v0.10.0-omnibus@sha256:90062edac57a2bd891d641344184f5f730f19394b1124f6fc53904a3d8cb21c2
    restart: on-failure
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
    volumes:
      - /run/udev:/run/udev:ro
      - ${APP_DATA_DIR}/data/config:/opt/scrutiny/config
      - ${APP_DATA_DIR}/data/influxdb:/opt/scrutiny/influxdb
    devices:
      # Umbrel Home has a single NVMe SSD
      - "/dev/nvme0"
