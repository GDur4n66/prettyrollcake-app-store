manifestVersion: 1
id: prettyrollcake-scrutiny
category: utilities
name: Scrutiny
version: "0.10.0"
tagline: Hard drive S.M.A.R.T. monitoring
icon: https://raw.githubusercontent.com/AnalogJ/scrutiny/v0.10.0/webapp/frontend/src/assets/images/logo/scrutiny-logo-dark.svg
description: >-
  Scrutiny collects S.M.A.R.T. data from your drives and shows their health,
  temperature history and failure risk in a web dashboard. It compares the
  values against real-world failure rates from Backblaze, not only the
  manufacturer's thresholds.


  This app is set up for Umbrel Home and monitors its internal NVMe SSD
  (/dev/nvme0). It will not start on devices without an NVMe drive.
releaseNotes: >-
  Scrutiny v0.10.0, pinned to a fixed image. The dashboard now goes through
  the Umbrel login and is no longer exposed directly on the network.
developer: AnalogJ
